[package]
name        = "sketch-nv"
version     = "0.0.1"
description = "HyperLogLog++, count-min, t-digest and reservoir sampling as mergeable, serialisable values with their published error bounds asserted as tests.  The 64-bit hash is the caller's, passed in rather than chosen here, and the sketch carries the caller's label for it so that merging two sketches fed through different hashes is refused."
license     = "Apache-2.0"

# An INTERFACE release: every `pub fn` body is a `todo()`, so the
# signatures and the effect rows are published and nothing is
# implemented.  `novo pkg publish` recognises the shape and requires
# both the draft stability and the 0.0.x version; the first
# implementation is the 0.1.0 published over it.
stability   = "draft"

# `core`.  A sketch is arithmetic over an array.  The hash arrives as a
# `fn(Bytes) -> Int` PARAMETER, and the reservoir's randomness arrives
# as uniform numbers the caller drew, so nothing here reads a clock,
# opens a file or needs `[rand]`.
layer       = "core"

category    = "tooling"

tags        = ["hyperloglog", "count-min", "t-digest", "reservoir-sampling", "streaming", "cardinality", "quantiles", "tooling"]
repository  = "https://github.com/novolang/sketch-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.9.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Streaming sketches with published error bounds, over a hash the caller chooses"

[dependencies]
# None.  The hash is a `fn(Bytes) -> Int` parameter rather than a
# dependency, so a caller that already hashes its keys — with
# xxhash-nv, with crypto-nv, with its own function — pays for one pass
# and this package pins nothing.
